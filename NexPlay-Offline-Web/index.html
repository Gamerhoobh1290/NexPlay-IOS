<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexPlay Offline</title>
    <meta http-equiv="refresh" content="0; url=./NexPlay.html">
    <link rel="icon" href="./NexPlay_N_final_256.ico" type="image/x-icon">
    <script>
        const nav = window.navigator || {};
        const ua = String(nav.userAgent || '');
        const isiOS = /iPad|iPhone|iPod/i.test(ua)
            || (nav.platform === 'MacIntel' && Number(nav.maxTouchPoints || 0) > 1);
        const isSmallTouchScreen = window.matchMedia('(pointer: coarse)').matches
            && window.matchMedia('(max-width: 820px)').matches;
        window.location.replace(isiOS || isSmallTouchScreen ? './NexPlay.mobile.html' : './NexPlay.html');
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #050505;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
        }

        main {
            padding: 1.5rem;
            text-align: center;
        }

        a {
            color: #67e8f9;
        }
    </style>
</head>
<body>
    <main>
        <p>Opening NexPlay Offline...</p>
        <p><a href="./NexPlay.html">Open manually</a></p>
    </main>
</body>
</html>
